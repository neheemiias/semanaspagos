<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#172554">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ingresar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #172554 0%,
                #2563eb 50%,
                #38bdf8 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
        }
        /* Fondo decorativo */
        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 50%;
            top: -180px;
            left: -150px;
            filter: blur(10px);
        }
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 50%;
            bottom: -180px;
            right: -130px;
            filter: blur(10px);
        }
        
        /* Cajas principales (comparten estilos de cristal) */
        .login-box, .pwa-warning {
            position: relative;
            z-index: 2;
            width: calc(100% - 40px);
            max-width: 380px;
            padding: 35px 28px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 24px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
            display: none; /* Se ocultan por defecto hasta que JS decide */
        }
        
        /* Específicos del Login */
        .login-box h1 {
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 28px;
            font-weight: 700;
        }
        .input-group {
            width: 100%;
        }
        .input-group input {
            width: 100%;
            height: 54px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.85);
            padding: 0 17px;
            font-size: 16px;
            color: #1e293b;
            outline: none;
        }
        .input-group input::placeholder {
            color: #64748b;
        }
        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.20);
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 18px 2px 24px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }
        .remember input {
            width: 17px;
            height: 17px;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .login-button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.30);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .login-button:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }
        .error {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        /* Específicos del cartel PWA */
        .pwa-warning {
            text-align: center;
        }
        .pwa-warning h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .pwa-warning p {
            color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ==========================================
           PANTALLA DEL SISTEMA
           ========================================== */
        #sistema {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: #ffffff;
            overflow: hidden;
        }
        #sistema iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @media (max-height: 600px) {
            .login-box, .pwa-warning {
                padding: 25px 24px;
            }
            .login-box h1 {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         CARTEL INSTALACIÓN PWA
         ========================================== -->
    <div class="pwa-warning" id="pwaWarning">
        <h1>Instalación Requerida</h1>
        <p>Para usar esta plataforma, necesitás instalarla en tu dispositivo ("Agregar a la pantalla principal") y abrirla desde allí.</p>
    </div>

    <!-- ==========================================
         LOGIN
         ========================================== -->
    <div class="login-box" id="loginBox">
        <h1>Ingresar</h1>
        <div class="input-group">
            <input
                type="text"
                id="usuario"
                placeholder="Ingresar usuario"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
            >
        </div>
        <label class="remember">
            <input
                type="checkbox"
                id="recordar"
            >
            <span>Recordar usuario</span>
        </label>
        <button
            class="login-button"
            onclick="iniciarSesion()"
        >
            Ingresar
        </button>
        <div
            class="error"
            id="error"
        >
            Usuario incorrecto.
        </div>
    </div>

    <!-- ==========================================
         SISTEMA
         ========================================== -->
    <div id="sistema">
        <iframe
            id="sistemaFrame"
            title="Pagos Semanales"
        ></iframe>
    </div>

    <script>
        const USUARIO_VALIDO = "admin";
        const DESTINO_URL = "https://semanaspagos.vercel.app/";

        window.addEventListener("DOMContentLoaded", function () {
            /* 
            ==========================================
            DETECTAR MODO APLICACIÓN (PWA)
            Comprueba si se abrió desde la pantalla de inicio.
            Cubre Android, Desktop Chrome/Edge y dispositivos iOS.
            ==========================================
            */
            const esAppInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

            if (!esAppInstalada) {
                // Si está en el navegador web normal, mostrar advertencia
                document.getElementById("pwaWarning").style.display = "block";
            } else {
                // Si es la app instalada, mostrar el login
                document.getElementById("loginBox").style.display = "block";

                // Lógica original de autologin
                const usuarioGuardado = localStorage.getItem("usuarioRecordado");
                if (usuarioGuardado) {
                    document.getElementById("usuario").value = usuarioGuardado;
                    document.getElementById("recordar").checked = true;
                    iniciarSesion(true);
                }
            }
        });

        function iniciarSesion(automatico = false) {
            const usuarioInput = document.getElementById("usuario");
            const recordar = document.getElementById("recordar");
            const error = document.getElementById("error");
            const usuario = usuarioInput.value.trim().toLowerCase();

            if (usuario === USUARIO_VALIDO) {
                sessionStorage.setItem("accesoPermitido", "true");

                if (recordar.checked) {
                    localStorage.setItem("usuarioRecordado", usuario);
                } else {
                    localStorage.removeItem("usuarioRecordado");
                }
                
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("sistema").style.display = "block";
                document.getElementById("sistemaFrame").src = DESTINO_URL;
            } else {
                error.style.display = "block";
                if (!automatico) {
                    usuarioInput.focus();
                }
            }
        }

        document.getElementById("usuario").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                iniciarSesion();
            }
        });
        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.error('Error al registrar SW', err));
        });
    }
</script>

    </script>
</body>
</html>
